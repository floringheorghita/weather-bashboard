<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather Dashboard</title>
<style>
  :root {
    --bg: #0e1620;
    --panel: rgba(8, 18, 30, 0.5);
    --ink: #eef3f7;
    --muted: #d3deea;
    --accent: #ffb547;
    --rain: #5db7ff;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif;
    padding: 2.5vh 3vw;
    display: grid;
    grid-template-rows: auto auto 1fr auto;
    gap: 1.6vh;
    overflow: hidden;
  }
  header { display: flex; justify-content: space-between; align-items: baseline; }
  #place { font-size: clamp(1.4rem, 3vw, 2.6rem); font-weight: 600; }
  #clock { font-size: clamp(1.4rem, 3vw, 2.6rem); font-variant-numeric: tabular-nums; color: var(--muted); }
  #clock small { font-size: 0.55em; margin-left: 0.6em; }

  main { display: grid; grid-template-columns: 1.1fr 1fr; gap: 3vw; min-height: 0; }
  .now { display: flex; flex-direction: column; justify-content: center; }
  .now .icon { font-size: clamp(4rem, 12vw, 10rem); line-height: 1; }
  .now .temp { font-size: clamp(4rem, 11vw, 9rem); font-weight: 300; line-height: 1; margin-top: 1vh; }
  .now .desc { font-size: clamp(1.4rem, 3vw, 2.6rem); color: var(--accent); margin-top: 1vh; }
  .now .meta { display: flex; gap: 1.2vw; margin-top: 2vh; color: var(--ink); font-size: clamp(0.9rem, 1.5vw, 1.4rem); flex-wrap: wrap; }
  .now .meta span { background: var(--panel); padding: 0.6vh 1.2vw; border-radius: 999px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }

  .days { display: flex; flex-direction: column; gap: 1.2vh; justify-content: center; }
  .day {
    display: grid; grid-template-columns: 1.2fr 0.8fr 1fr 1fr; align-items: center;
    background: var(--panel); border-radius: 14px; padding: 1vh 1.6vw;
    font-size: clamp(1rem, 2vw, 1.8rem);
  }
  .day .ic { font-size: 1.6em; }
  .day .rain { color: var(--rain); }
  .day .lo { color: var(--muted); text-align: right; }
  .day .hi { text-align: right; font-weight: 600; }

  .hours { display: grid; grid-template-columns: repeat(8, 1fr); gap: 1vw; }
  .hour { text-align: center; padding: 1.2vh 0; border-top: 2px solid var(--panel); font-size: clamp(0.9rem, 1.6vw, 1.5rem); }
  .hour .h { color: var(--muted); }
  .hour .ic { font-size: 1.7em; margin: 0.3vh 0; }
  .hour .p { color: var(--rain); font-size: 0.85em; min-height: 1.2em; }

  #sky, #fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; }
  #sky { z-index: -2; transition: opacity 1s; }
  body { text-shadow: 0 1px 8px rgba(0, 0, 0, 0.35); }
  .day { backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .hour { border-top-color: rgba(255, 255, 255, 0.25); }
  .wi { width: 1em; height: 1em; display: inline-block; vertical-align: middle; }
  .now .icon .wi { display: block; }
  .tip { display: flex; gap: 1.2vw; flex-wrap: wrap; font-size: clamp(1rem, 1.9vw, 1.7rem); }
  .tip span { background: var(--panel); border-radius: 999px; padding: 0.7vh 1.4vw; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .right { display: flex; flex-direction: column; gap: 1.2vh; justify-content: center; }
  .card { background: var(--panel); border-radius: 14px; padding: 1.2vh 1.6vw; display: flex; align-items: center; gap: 1.5vw; font-size: clamp(0.9rem, 1.6vw, 1.4rem); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .times { display: flex; justify-content: space-between; color: var(--muted); }
  .dot { display: inline-block; width: 0.7em; height: 0.7em; border-radius: 50%; margin-right: 0.4em; }
  .arrow { width: 1em; height: 1em; vertical-align: -0.12em; margin-left: 0.3em; }
  .hours-wrap { position: relative; }
  #graph { width: 100%; height: 11vh; display: block; }
  #dim { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 5; transition: opacity 3s; }
  body > header, body > .tip, body > main, body > .hours-wrap { transform: translate(var(--sx, 0px), var(--sy, 0px)); transition: transform 3s; }
  #status { position: fixed; right: 1vw; bottom: 0.6vh; font-size: 0.75rem; color: var(--muted); }

  @media (max-width: 800px) {
    body { overflow: auto; }
    main { grid-template-columns: 1fr; }
    .hours { grid-template-columns: repeat(4, 1fr); }
    #graph { display: none; }
  }
</style>
</head>
<body>
  <div id="sky"></div>
  <canvas id="fx"></canvas>
  <header>
    <div id="place"></div>
    <div id="clock"></div>
  </header>
  <div class="tip" id="tip"></div>

  <main>
    <section class="now">
      <div class="icon" id="icon">…</div>
      <div class="temp" id="temp">--°</div>
      <div class="desc" id="desc">Loading</div>
      <div class="meta" id="meta"></div>
    </section>
    <section class="right"><div class="days" id="days"></div><div class="card" id="sun"></div></section>
  </main>

  <section class="hours-wrap"><div class="hours" id="hours"></div><svg id="graph" viewBox="0 0 1000 100" preserveAspectRatio="none"></svg></section>
  <div id="dim"></div>
  <div id="status"></div>

<script>
/* ---------- Settings: edit these ---------- */
const CONFIG = {
  name: "Erith",          // label shown at the top
  lat: 51.48,             // latitude  (rounded, fine for a public repo)
  lon: 0.18,              // longitude
  units: "celsius",       // "celsius" or "fahrenheit"
  windUnit: "mph",        // "kmh", "mph", "ms" or "kn"
  refreshMinutes: 10
};
/* ------------------------------------------ */

const TEXT = {
  0: "Clear", 1: "Mostly clear", 2: "Partly cloudy", 3: "Overcast",
  45: "Fog", 48: "Freezing fog",
  51: "Light drizzle", 53: "Drizzle", 55: "Heavy drizzle", 56: "Freezing drizzle", 57: "Freezing drizzle",
  61: "Light rain", 63: "Rain", 65: "Heavy rain", 66: "Freezing rain", 67: "Freezing rain",
  71: "Light snow", 73: "Snow", 75: "Heavy snow", 77: "Snow grains",
  80: "Showers", 81: "Heavy showers", 82: "Violent showers", 85: "Snow showers", 86: "Heavy snow showers",
  95: "Thunderstorm", 96: "Thunderstorm, hail", 99: "Thunderstorm, hail"
};
const wx = c => TEXT[c] || "Unknown";

/* Weather icons drawn as inline SVG, so they show on any device (no emoji font needed) */
function icon(code, day = 1) {
  const cloud = col => `<g fill="${col}"><circle cx="24" cy="38" r="9"/><circle cx="35" cy="31" r="12"/><circle cx="46" cy="38" r="8"/><rect x="24" y="38" width="22" height="9"/></g>`;
  const sun = (x, y, r) => {
    let rays = "";
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4, c = Math.cos(a), s = Math.sin(a);
      rays += `<line x1="${x + c * (r + 4)}" y1="${y + s * (r + 4)}" x2="${x + c * (r + 9)}" y2="${y + s * (r + 9)}"/>`;
    }
    return `<g stroke="#ffc93c" stroke-width="3" stroke-linecap="round">${rays}</g><circle cx="${x}" cy="${y}" r="${r}" fill="#ffc93c"/>`;
  };
  const moon = `<path d="M38 12A20 20 0 1 0 54 42A16 16 0 0 1 38 12z" fill="#f4f1de"/>`;
  const drops = n => `<g stroke="#5db7ff" stroke-width="3" stroke-linecap="round">` +
    [26, 36, 46].slice(0, n).map(x => `<line x1="${x}" y1="50" x2="${x - 3}" y2="58"/>`).join("") + `</g>`;
  const light = "#e8eef4", dark = "#a9b6c3";
  let body;
  if (code <= 1) body = day ? sun(32, 32, 12) : moon;
  else if (code === 2) body = (day ? sun(24, 22, 8) : `<g transform="translate(-6,-8) scale(.7)">${moon}</g>`) + cloud(light);
  else if (code === 3) body = cloud(light);
  else if (code === 45 || code === 48) body = cloud(light) +
    `<g stroke="#cfd8e1" stroke-width="3" stroke-linecap="round"><line x1="20" y1="52" x2="50" y2="52"/><line x1="26" y1="58" x2="44" y2="58"/></g>`;
  else if ([71, 73, 75, 77, 85, 86].includes(code)) body = cloud(light) +
    `<g fill="#ffffff"><circle cx="26" cy="53" r="2.8"/><circle cx="36" cy="57" r="2.8"/><circle cx="46" cy="53" r="2.8"/></g>`;
  else if (code >= 95) body = cloud(dark) + `<polygon points="37,42 28,54 34,54 30,63 43,49 37,49 41,42" fill="#ffc93c"/>`;
  else body = cloud(dark) + drops(code <= 57 ? 2 : 3);
  return `<svg class="wi" viewBox="0 0 64 64" aria-hidden="true">${body}</svg>`;
}
const $ = id => document.getElementById(id);
const unitSym = CONFIG.units === "fahrenheit" ? "°F" : "°C";
const windLabel = { kmh: "km/h", mph: "mph", ms: "m/s", kn: "kn" }[CONFIG.windUnit];

$("place").textContent = CONFIG.name;

function tickClock() {
  const d = new Date();
  $("clock").innerHTML =
    d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) +
    "<small>" + d.toLocaleDateString([], { weekday: "short", day: "numeric", month: "short" }) + "</small>";
}
tickClock();
setInterval(tickClock, 1000);

async function load() {
  const url = "https://api.open-meteo.com/v1/forecast" +
    `?latitude=${CONFIG.lat}&longitude=${CONFIG.lon}` +
    "&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m,is_day" +
    "&hourly=temperature_2m,weather_code,precipitation_probability,is_day,uv_index" +
    "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset" +
    "&minutely_15=precipitation&forecast_minutely_15=24" +
    `&temperature_unit=${CONFIG.units}&wind_speed_unit=${CONFIG.windUnit}` +
    "&timezone=auto&forecast_days=5";
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error("HTTP " + r.status);
    render(await r.json());
    await loadAir();
    $("status").textContent = "Updated " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  } catch (e) {
    $("status").textContent = "Update failed, retrying. " + e.message;
  }
}

function render(d) {
  const c = d.current, text = wx(c.weather_code);
  $("icon").innerHTML = icon(c.weather_code, c.is_day);
  setScene(c.weather_code, c.is_day);
  $("temp").textContent = Math.round(c.temperature_2m) + "°";
  $("desc").textContent = text;
  $("meta").innerHTML =
    `<span>Feels like ${Math.round(c.apparent_temperature)}${unitSym}</span>` +
    `<span>Humidity ${c.relative_humidity_2m}%</span>` +
    `<span>Wind ${Math.round(c.wind_speed_10m)} ${windLabel} ${compass(c.wind_direction_10m)}</span>`;

  // Next 8 hours, starting from the current hour
  const now = c.time.slice(0, 13) + ":00";
  const start = Math.max(0, d.hourly.time.findIndex(t => t >= now));
  $("hours").innerHTML = d.hourly.time.slice(start, start + 24).filter((_, i) => i % 3 === 0).map((t, i) => {
    const k = start + i * 3;
    return `<div class="hour">
      <div class="h">${i === 0 ? "Now" : t.slice(11, 16)}</div>
      <div class="ic">${icon(d.hourly.weather_code[k], d.hourly.is_day[k])}</div>
      <div>${Math.round(d.hourly.temperature_2m[k])}°</div>
      <div class="p">${d.hourly.precipitation_probability[k] >= 20 ? d.hourly.precipitation_probability[k] + "%" : ""}</div>
    </div>`;
  }).join("");

  // 5-day forecast
  $("days").innerHTML = d.daily.time.map((t, i) => {
    const name = i === 0 ? "Today" : new Date(t + "T12:00").toLocaleDateString([], { weekday: "long" });
    const p = d.daily.precipitation_probability_max[i];
    return `<div class="day">
      <span>${name}</span>
      <span class="ic">${icon(d.daily.weather_code[i], 1)}</span>
      <span class="rain">${p >= 20 ? p + "%" : ""}</span>
      <span><span class="lo">${Math.round(d.daily.temperature_2m_min[i])}°</span>&nbsp;&nbsp;<span class="hi">${Math.round(d.daily.temperature_2m_max[i])}°</span></span>
    </div>`;
  }).join("");
  extras(d, c, start);
}

function compass(deg) {
  const dir = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"][Math.round(deg / 45) % 8];
  return `${dir}<svg class="arrow" viewBox="0 0 24 24" style="transform:rotate(${deg + 180}deg)"><path d="M12 3L19 20L12 16L5 20Z" fill="currentColor"/></svg>`;
}

function moon() {
  const M = 29.530588853;
  const p = ((((Date.now() - Date.UTC(2000, 0, 6, 18, 14)) / 86400000) % M) + M) % M / M;
  const k = Math.cos(2 * Math.PI * p), os = p < 0.5 ? 1 : 0, is = k > 0 ? 1 - os : os, rx = 20 * Math.abs(k);
  const svg = `<svg viewBox="0 0 48 48" style="width:8vh;height:8vh"><circle cx="24" cy="24" r="20" fill="#2a3548"/><path d="M24 4A20 20 0 0 ${os} 24 44A${rx} 20 0 0 ${is} 24 4z" fill="#f4f1de"/></svg>`;
  const names = [[0.03, "New moon"], [0.22, "Waxing crescent"], [0.28, "First quarter"], [0.47, "Waxing gibbous"],
    [0.53, "Full moon"], [0.72, "Waning gibbous"], [0.78, "Last quarter"], [0.97, "Waning crescent"], [1.01, "New moon"]];
  return { svg, name: names.find(n => p < n[0])[1] };
}

function extras(d, c, start) {
  const hm = str => str.slice(11, 16);
  const dur = mins => mins >= 90 ? Math.round(mins / 60) + " hours" : mins + " min";

  // UV pill
  const uv = Math.round(d.hourly.uv_index[start] || 0);
  const u = [[2, "Low", "#4ade80"], [5, "Moderate", "#facc15"], [7, "High", "#fb923c"], [10, "Very high", "#f87171"], [99, "Extreme", "#c084fc"]].find(x => uv <= x[0]);
  $("meta").insertAdjacentHTML("beforeend", `<span><i class="dot" style="background:${u[2]}"></i>UV ${uv} ${u[1]}</span>`);

  // Rain-soon line + what-to-wear line
  const m = d.minutely_15, N = m.time.length;
  const floor = c.time.slice(0, 14) + String(Math.floor(+c.time.slice(14, 16) / 15) * 15).padStart(2, "0");
  const ni = Math.max(0, m.time.findIndex(t => t >= floor));
  const wet = i => (m.precipitation[i] || 0) >= 0.1;
  let j = ni, rain;
  if (wet(ni)) {
    while (j < N && wet(j)) j++;
    rain = j >= N ? "Rain continuing for hours" : `Rain easing in about ${dur((j - ni) * 15)}`;
  } else {
    while (j < N && !wet(j)) j++;
    rain = j >= N ? `Dry for the next ${Math.round((N - ni) / 4)} hours` : `Rain starting in about ${dur((j - ni) * 15)}`;
  }
  const fl = CONFIG.units === "fahrenheit" ? (c.apparent_temperature - 32) * 5 / 9 : c.apparent_temperature;
  let wear = fl <= 0 ? "Bundle up: coat, hat and gloves" : fl <= 7 ? "Wear a warm coat" : fl <= 13 ? "A jacket is a good idea"
    : fl <= 19 ? "A light layer will do" : fl <= 25 ? "T-shirt weather" : "Stay cool and drink water";
  if (Math.max(...d.hourly.precipitation_probability.slice(start, start + 6)) >= 40) wear += "; take an umbrella";
  if (uv >= 6 && c.is_day) wear += "; wear sunscreen";
  $("tip").innerHTML = `<span>${rain}</span><span>${wear}</span>`;

  // Sun arc by day, moon phase at night
  const t = new Date(c.time), sr = new Date(d.daily.sunrise[0]), ss = new Date(d.daily.sunset[0]);
  if (t >= sr && t <= ss) {
    const th = Math.PI * (1 - (t - sr) / (ss - sr));
    const x = 100 + 90 * Math.cos(th), y = 85 - 70 * Math.sin(th);
    $("sun").innerHTML = `<div style="width:100%"><svg viewBox="0 0 200 95" style="width:100%;height:9vh"><path d="M10 85A90 70 0 0 1 190 85" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="2" stroke-dasharray="4 4"/><line x1="0" y1="85" x2="200" y2="85" stroke="rgba(255,255,255,.3)"/><circle cx="${x}" cy="${y}" r="7" fill="#ffc93c"/></svg><div class="times"><span>Sunrise ${hm(d.daily.sunrise[0])}</span><span>Sunset ${hm(d.daily.sunset[0])}</span></div></div>`;
  } else {
    const mn = moon(), rise = t < sr ? d.daily.sunrise[0] : d.daily.sunrise[1];
    $("sun").innerHTML = `${mn.svg}<div><div>${mn.name}</div><div class="times">Sunrise ${hm(rise)}</div></div>`;
  }

  // 22-hour temperature curve under the hourly strip
  const temps = d.hourly.temperature_2m.slice(start, start + 22);
  const lo = Math.min(...temps), span = Math.max(Math.max(...temps) - lo, 1);
  const pts = temps.map((v, i) => [(i / 3 + 0.5) / 8 * 1000, 88 - (v - lo) / span * 76]);
  let path = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], mx = (x0 + x1) / 2;
    path += `C${mx},${y0} ${mx},${y1} ${x1},${y1}`;
  }
  const end = pts[pts.length - 1];
  $("graph").innerHTML = `<defs><linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb547" stop-opacity=".35"/><stop offset="1" stop-color="#ffb547" stop-opacity="0"/></linearGradient></defs><path d="${path}L${end[0]},100L${pts[0][0]},100Z" fill="url(#gf)"/><path d="${path}" fill="none" stroke="#ffb547" stroke-width="3" vector-effect="non-scaling-stroke"/>`;

  // Dim the screen after dark
  const hr = +c.time.slice(11, 13);
  $("dim").style.opacity = c.is_day ? 0 : (hr >= 23 || hr < 6 ? 0.55 : 0.35);
}

async function loadAir() {
  try {
    const pol = ["alder", "birch", "grass", "mugwort", "olive", "ragweed"].map(x => x + "_pollen");
    const r = await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${CONFIG.lat}&longitude=${CONFIG.lon}&current=european_aqi,${pol.join(",")}&timezone=auto`);
    if (!r.ok) return;
    const c = (await r.json()).current;
    let html = "";
    if (c.european_aqi != null) {
      const a = [[20, "Good", "#4ade80"], [40, "Fair", "#a3e635"], [60, "Moderate", "#facc15"], [80, "Poor", "#fb923c"], [100, "Very poor", "#f87171"], [999, "Extremely poor", "#c084fc"]].find(x => c.european_aqi <= x[0]);
      html += `<span><i class="dot" style="background:${a[2]}"></i>Air ${a[1]}</span>`;
    }
    const vals = pol.map(k => c[k]).filter(v => v != null);
    if (vals.length) {
      const mx = Math.max(...vals), P = mx < 10 ? ["Low", "#4ade80"] : mx < 50 ? ["Moderate", "#facc15"] : mx < 200 ? ["High", "#fb923c"] : ["Very high", "#f87171"];
      html += `<span><i class="dot" style="background:${P[1]}"></i>Pollen ${P[0]}</span>`;
    }
    $("meta").insertAdjacentHTML("beforeend", html);
  } catch (e) { /* air quality is optional */ }
}

/* Screen care: reload at 3 am, nudge the layout every 5 minutes to avoid burn-in */
setInterval(() => { const n = new Date(); if (n.getHours() === 3 && n.getMinutes() === 0) location.reload(); }, 60000);
setInterval(() => {
  const r = () => (Math.round(Math.random() * 12) - 6) + "px";
  document.body.style.setProperty("--sx", r());
  document.body.style.setProperty("--sy", r());
}, 5 * 60 * 1000);

/* ---------- Animated background ---------- */
const sky = $("sky"), cv = $("fx"), ctx = cv.getContext("2d");
let W = 0, H = 0, scene = "", key = "", night = false, parts = [], clouds = [], flash = 0, nextFlash = 0;
const rnd = (a, b) => a + Math.random() * (b - a);

const SKY = {
  sun: "linear-gradient(#2a7fd6, #6fbcf0 65%, #c3e6fb)",
  night: "linear-gradient(#050b1a, #16244d)",
  cloud: "linear-gradient(#4f6579, #97a8b8)",
  cloudnight: "linear-gradient(#0c131f, #2b3646)",
  rain: "linear-gradient(#26313c, #4b5a68)",
  storm: "linear-gradient(#12161d, #343d49)",
  snow: "linear-gradient(#4b5d72, #b0bdca)",
  fog: "linear-gradient(#6c7884, #aab3bb)"
};
const CLOUD_TINT = {
  sun: [255, 255, 255, 0.85], cloud: [235, 240, 245, 0.7], cloudnight: [70, 82, 102, 0.7],
  rain: [95, 106, 118, 0.8], storm: [42, 48, 58, 0.85], snow: [225, 232, 240, 0.7], fog: [225, 230, 235, 0.28]
};
const CLOUD_COUNT = { sun: 2, cloud: 7, rain: 6, storm: 7, snow: 5, fog: 6, night: 0 };

function sceneFor(code, isDay) {
  if (code <= 1) return isDay ? "sun" : "night";
  if (code <= 3) return "cloud";
  if (code === 45 || code === 48) return "fog";
  if ([71, 73, 75, 77, 85, 86].includes(code)) return "snow";
  if (code === 82 || code >= 95) return "storm";
  return "rain";
}

function build() {
  parts = []; clouds = [];
  const n = { rain: W / 6, storm: W / 4, snow: W / 12, night: 140, sun: 40 }[scene] || 0;
  for (let i = 0; i < n; i++) {
    parts.push({ x: rnd(0, W), y: rnd(0, H), l: rnd(12, 30), v: rnd(14, 28), r: rnd(1.5, 4.5), ph: rnd(0, 6.28) });
  }
  const big = scene === "fog";
  for (let i = 0; i < CLOUD_COUNT[scene]; i++) {
    clouds.push({ x: rnd(-0.1 * W, W), y: big ? rnd(0.3 * H, 0.9 * H) : rnd(0, 0.45 * H),
      s: big ? rnd(300, 500) : rnd(120, 280), v: rnd(0.15, 0.5) });
  }
}

function setScene(code, isDay) {
  scene = sceneFor(code, isDay);
  night = !isDay;
  const k = scene === "cloud" && night ? "cloudnight" : scene;
  if (k === key) return;
  key = k;
  sky.style.background = SKY[k];
  build();
}

function resize() {
  W = cv.width = innerWidth;
  H = cv.height = innerHeight;
  build();
}
addEventListener("resize", resize);

function drawCloud(c, tint) {
  const [r, g, b, a] = tint;
  [[-0.6, 0.1, 0.5], [-0.25, -0.15, 0.65], [0.2, -0.1, 0.6], [0.6, 0.1, 0.45], [0, 0.15, 0.6]].forEach(([ox, oy, k]) => {
    const x = c.x + ox * c.s, y = c.y + oy * c.s, rad = k * c.s;
    const gr = ctx.createRadialGradient(x, y, 0, x, y, rad);
    gr.addColorStop(0, `rgba(${r},${g},${b},${a})`);
    gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(x, y, rad, 0, 6.283); ctx.fill();
  });
}

function frame(t) {
  ctx.clearRect(0, 0, W, H);

  // Clouds (every scene except clear night)
  const tint = CLOUD_TINT[key];
  if (tint) clouds.forEach(c => {
    c.x += c.v;
    if (c.x - c.s * 1.2 > W) c.x = -c.s * 1.2;
    drawCloud(c, tint);
  });

  if (scene === "sun") {
    const sx = W * 0.82, sy = H * 0.18, R = H * 0.4 * (1 + 0.03 * Math.sin(t / 1500));
    const gl = ctx.createRadialGradient(sx, sy, 0, sx, sy, R);
    gl.addColorStop(0, "rgba(255,245,190,0.9)");
    gl.addColorStop(1, "rgba(255,220,120,0)");
    ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(sx, sy, R, 0, 6.283); ctx.fill();
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(t / 25000);
    ctx.fillStyle = "rgba(255,248,210,0.08)";
    for (let i = 0; i < 12; i++) {
      ctx.rotate(Math.PI / 6);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(W, -W * 0.05); ctx.lineTo(W, W * 0.05); ctx.fill();
    }
    ctx.restore();
    ctx.fillStyle = "rgba(255,252,225,0.95)";
    ctx.beginPath(); ctx.arc(sx, sy, H * 0.06, 0, 6.283); ctx.fill();
    parts.forEach(p => {
      p.y -= p.v * 0.03; p.x += Math.sin(t / 2000 + p.ph) * 0.3;
      if (p.y < -10) { p.y = H + 10; p.x = rnd(0, W); }
      ctx.fillStyle = `rgba(255,255,220,${0.25 + 0.2 * Math.sin(t / 900 + p.ph)})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
    });
  }

  if (scene === "night") {
    parts.forEach(p => {
      ctx.fillStyle = `rgba(255,255,255,${0.3 + 0.7 * Math.abs(Math.sin(t / 900 + p.ph))})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 0.5, 0, 6.283); ctx.fill();
    });
    const mx = W * 0.82, my = H * 0.18, mr = H * 0.05;
    const gl = ctx.createRadialGradient(mx, my, mr, mx, my, mr * 5);
    gl.addColorStop(0, "rgba(220,230,255,0.35)"); gl.addColorStop(1, "rgba(220,230,255,0)");
    ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(mx, my, mr * 5, 0, 6.283); ctx.fill();
    ctx.fillStyle = "#f4f1de"; ctx.beginPath(); ctx.arc(mx, my, mr, 0, 6.283); ctx.fill();
  }

  if (scene === "rain" || scene === "storm") {
    ctx.strokeStyle = "rgba(180,210,255,0.5)"; ctx.lineWidth = 1.3;
    ctx.beginPath();
    parts.forEach(p => {
      p.y += p.v; p.x -= p.v * 0.2;
      if (p.y > H) { p.y = -p.l; p.x = rnd(0, W + 200); }
      ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.l * 0.2, p.y + p.l);
    });
    ctx.stroke();
    if (scene === "storm") {
      if (t > nextFlash) { flash = 1; nextFlash = t + rnd(4000, 10000); }
      if (flash > 0.02) {
        ctx.fillStyle = `rgba(255,255,255,${flash * 0.55})`; ctx.fillRect(0, 0, W, H);
        flash *= 0.9;
      }
    }
  }

  if (scene === "snow") {
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    parts.forEach(p => {
      p.y += p.v * 0.09 * p.r; p.x += Math.sin(t / 1000 + p.ph) * 0.6;
      if (p.y > H + 5) { p.y = -5; p.x = rnd(0, W); }
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
    });
  }

  requestAnimationFrame(frame);
}

setScene(3, 1);   // neutral sky until the first forecast arrives
resize();
requestAnimationFrame(frame);

load();
setInterval(load, CONFIG.refreshMinutes * 60 * 1000);
</script>
</body>
</html>
